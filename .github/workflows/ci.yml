name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 완성본 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # 연습문제(@Tag("exercise"))는 test 태스크에서 제외돼 있다.
      # 일부러 실패하도록 둔 것이라, 여기 섞이면 CI 가 영원히 빨간불이 된다.
      - name: 테스트
        run: ./gradlew test

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
