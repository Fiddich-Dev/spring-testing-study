# 학습용이라 최소한만 둔다.
spring.application.name=spring-testing-study

# Boot 의 기본값을 **명시적으로** 적어 둔다. 05장에서 이 값을 바꿔 가며
# 응답이 어떻게 달라지는지 보기 위한 것이고, 기본이 무엇인지 헷갈리지 않기 위한 것이다.
#   always   : null 필드도 키째 내보낸다 (Boot 기본)
#   non_null : null 필드를 통째로 뺀다
spring.jackson.default-property-inclusion=always

# 날짜를 타임스탬프 숫자가 아니라 ISO 문자열로. Boot 는 이미 false 로 두지만,
# 이 줄이 없으면 "왜 배열로 나오지?" 를 언젠가 한 번은 겪는다.
spring.jackson.serialization.write-dates-as-timestamps=false
